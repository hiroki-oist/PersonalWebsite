    type: entries
    items:
      - period: 2026.10
        title: 魔法の塔 復刻版（iOS アプリ、App Store 公開中）
        lines: ["個人開発 | C#, Unity, iOS | <a href=\"https://apps.apple.com/jp/app/%E9%AD%94%E6%B3%95%E3%81%AE%E5%A1%94-%E5%BE%A9%E5%88%BB%E7%89%88/id6815624226\">App Store</a>"]
        bullets:
          - 1995 年に N.W 氏が PC-9800 シリーズ向けに発表したローグライクダンジョン RPG「魔法の塔」を、原作者の許諾を得て iPhone 向けにリメイク。
          - 全 50 階の盤面配置・敵の数値・イベント順序を原典どおりに再現し、現代のスマートフォン向けに UI を再設計。C# と Unity で開発。
          - 企画・UI 設計・開発から App Store での公開・運営まで、すべて一人で担当（基本無料、買い切り型アプリ内課金）。
      - period: 2025.3 – present
        title: LLM ベースのモバイルゲームアプリ（開発中）
        lines: ["個人開発 | Swift, Python, OpenAI API"]
        bullets:
          - AI が思い浮かべたお題を、ユーザーが質問を通じて当てる iOS ゲームを個人開発中。
          - OpenAI GPT API と AWS Lambda を用いて、リアルタイムでの推論とデータ処理を実装。
          - ジャンルごとの一貫した回答を実現するため、プロンプトエンジニアリングを駆使して応答範囲を制御。
          - コスト削減のため、Retrieval-Augmented Generation（RAG）を導入し、応答の一貫性と自然さを両立。
          - Swift と Xcode を用いてネイティブアプリとして開発。デモは希望があれば提示可能（多忙によりリリース未定）。

