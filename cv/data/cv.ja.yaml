  - title: 研究歴
    type: entries
    items:
      - period: 2026.4 – present
        title: Sony Computer Science Laboratory, Humanity Science Project
        lines: [プロジェクトリサーチャー, 笠原俊一 リサーチディレクター]
        meta: 東京、日本
        project: 高度技能ロボットを実現する身体融合学習基盤の創出（CREST）
        bullets:
          - オープンソースヒューマノイドロボット “OpenArm” を用いた物理的な人―ロボット相互作用実験の立ち上げを行う。
          - Enactic 社製 OpenArm を使用。
          - 小型ロボット制御器を「観測→行動」の写像として圧縮するのではなく、センサ運動ダイナミクスの予測と予測誤差による潜在状態推論として組む PredVLA を提案 {{cite:predvla}}。
          - 単軸条件と同時条件をペアにして評価する 6 軸ベンチマーク LIBERO-CTRL を提案し、集計成功率では見えない VLA 方策の複合ロバスト性の失敗を明らかにした {{cite:liberoctrl}}。

      - period: 2025.1 – 2025.7
        title: CY セルジー・パリ大学　情報処理・システム工学研究室 (Équipes Traitement de l’Information et Systèmes Lab)
        lines: ["アレクサンドル ピティ教授, マティアス クォイ教授 (Prof. Alexandre Pitti, Prof. Mathias Quoy)"]
        meta: セルジー、フランス
        project: 安定した実ロボットタスク遂行に向けた、予測符号化を基にした RNN の研究
        bullets:
          - 予測符号化とクラス Embedding を多層化 RNN に埋め込むことで、「生成、認識、自信のメタ推論」をリアルタイムに行える新たなモデル、CERNet を提案。
          - ロボットを人が導いて手書きアルファベット 26 文字を教えることで、シミュレーションと実空間それぞれにおいて、学んだ 26 軌道の安定生成、軌道の認識、およびその確度のメタ推定ができることを示した。
          - 奨学金を取得してフランスのラボにて外部研究員として勤務し、当該ラボの教授２名と共同研究を行った。Pollen Robotics 社製ヒューマノイドロボット、Reachy を使用。
          - 研究成果は IEEE International Conference on Robotics and Automation (ICRA) の Proceedings にて発表 {{cite:cernet}}。

      - period: 2021.9 – 2026.6
        title: 沖縄科学技術大学院大学　認知脳ロボティクス研究ユニット
        lines: [谷淳 教授]
        meta: 沖縄、日本
        project: 自由エネルギー原理を基にした力覚的な人-ロボットの相互作用研究
        bullets:
          - 自由エネルギー原理に基づき、予測符号化的な変分 RNN を用いてヒューマノイドロボットとの身体的な相互作用をモデル化し、人間とロボット間の双方向の感覚運動ダイナミクスを探究。
          - 相互適応的な運動行動を通して、力覚と変分 RNN モデルの内部状態の関係を研究 {{cite:tsmc}}。
          - 変分 RNN の段階的学習による新たな行動の発現を研究 {{cite:iros}}。
          - 自由エネルギーで学習率をゲートすることで、オンラインに人との相互作用を通して学び続けられるフレームワークを提案 {{cite:fegp}}。
          - 再構成誤差の履歴に応じて PV-RNN のメタプライアをオンラインで切り替え、内部生成と外界の感覚証拠への依存度をロボット自身が調整する機構を共同で研究 {{cite:metaprior}}。

      - period: [2019.7 – 2020.1, 2021.1 – 2021.4]
        title: 沖縄科学技術大学院大学　量子物質化学ユニット
        lines: [岡田佳憲 准教授]
        meta: 沖縄、日本
        project: ファンデルワールス化合物における磁気特性評価
        bullets:
          - 藤澤博士と今井博士と共に、ファンデルワールス層状化合物 CeTe<sub>3</sub> 及び CeTe<sub>2</sub>Se の磁気特性を評価した。研究成果は論文として発表済み {{cite:jpsj}}。

      - period: 2019.4 – 2020.3
        title: 慶應義塾大学　的場・神原研究室
        lines: [的場正憲 教授、神原陽一 教授]
        meta: 神奈川、日本
        project: Cu 欠陥による複合アニオン層状化合物の熱電変換効率最適化に向けた試料合成
        bullets:
          - 高い熱電変換効率が期待される LaCu<sub>1−δ</sub>S<sub>0.5</sub>Se<sub>0.5</sub>O の多結晶体合成に初めて成功。
          - LaCu<sub>1−δ</sub>S<sub>0.5</sub>Se<sub>0.5</sub>O 多結晶体における、Cu 欠陥の熱電変換特性への影響を評価した。研究成果は論文として発表済み {{cite:kjmr,mstj}}。

