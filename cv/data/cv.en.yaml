  - title: Research Experience
    type: entries
    items:
      - period: 2026.4 – present
        title: Sony Computer Science Laboratory, Humanity Science Project
        lines: [Project Researcher, Shunichi Kasahara (Research Director)]
        meta: Tokyo, Japan
        project: Body Integration Learning Framework for Highly Skilled Robots
        bullets:
          - Leading the setup of physical human-robot interaction experiments using the open-source humanoid robot “OpenArm” (Enactic).
          - Proposed PredVLA, a compact recurrent controller organized around predicting sensorimotor dynamics and inferring its latent state from prediction error, rather than compressing a conventional observation-to-action policy {{cite:predvla}}.
          - Proposed LIBERO-CTRL, a six-axis benchmark that pairs single-axis and compound perturbations from identical initial states, revealing compound-robustness failures of VLA policies that aggregate success rates hide {{cite:liberoctrl}}.

      - period: 2025.1 – 2025.7
        title: Équipes Traitement de l’Information et Systèmes Lab, CY Cergy Paris University
        lines: ["Prof. Alexandre Pitti, Prof. Mathias Quoy"]
        meta: Cergy, France
        project: Investigation of Robust Predictive-Coding inspired Recurrent Neural Network in Real Robot Tasks
        bullets:
          - Proposed CERNet, a hierarchical predictive-coding RNN with class embedding, enabling unified real-time motion generation, recognition, and meta-inference of confidence.
          - Demonstrated stable reproduction of 26 handwritten alphabet trajectories and confidence estimation using the Reachy humanoid robot (Pollen Robotics) in both simulation and real-world settings.
          - Published in <i>Proceedings of the IEEE International Conference on Robotics and Automation (ICRA), 2026</i> {{cite:cernet}}.

      - period: 2021.9 – 2026.6
        title: Cognitive Neuro-robotics Research Unit, Okinawa Institute of Science and Technology Graduate University
        lines: [Prof. Jun Tani]
        meta: Okinawa, Japan
        project: Human-Robot Kinaesthetic Interaction Based on the Free Energy Principle
        bullets:
          - Investigated human-robot kinaesthetic interaction using a predictive coding-inspired variational RNN, guided by the Free Energy Principle, to model bidirectional sensorimotor dynamics between humans and a humanoid robot.
          - Through mutually adaptive physical behaviors through active inference, conducted research on revealing the relationship between kinaesthetic perception and the internal state of the employed variational RNN {{cite:tsmc}}.
          - Studied the emergence of novel behaviours through incremental learning with variational RNNs {{cite:iros}}.
          - Proposed a framework where a network can continuously learn new movements through human-robot interaction by gating the learning rate based on the free energy {{cite:fegp}}.
          - Co-developed a mechanism that switches PV-RNN meta-priors online according to accumulated reconstruction error, letting the robot regulate its reliance on internally generated predictions versus external sensory evidence {{cite:metaprior}}.

      - period: [2019.7 – 2020.1, 2021.1 – 2021.4]
        title: Quantum Materials Science Unit, Okinawa Institute of Science and Technology Graduate University
        lines: [Prof. Yoshinori Okada]
        meta: Okinawa, Japan
        project: Evaluation of magnetic properties in van der Waals compounds
        bullets:
          - Evaluated the magnetic properties of van der Waals compounds CeTe<sub>3</sub> and CeTe<sub>2</sub>Se (collaborated with Dr. Imai and Dr. Fujisawa). Results published as a full journal paper {{cite:jpsj}}.

      - period: 2019.4 – 2020.3
        title: Matoba & Kamihara Lab, Keio University
        lines: ["Prof. Masanori Matoba, Prof. Yoichi Kamihara"]
        meta: Kanagawa, Japan
        project: Synthesis of layered oxysulfide to optimize thermoelectric properties
        bullets:
          - Synthesised polycrystalline LaCuS<sub>0.5</sub>Se<sub>0.5</sub>O, which is expected to have high thermoelectric performance, for the first time.
          - Evaluated the effect of copper deficiency in the polycrystalline sample on its thermoelectric properties. Results published in full journal papers {{cite:kjmr,mstj}}.

