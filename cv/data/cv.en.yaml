      - period: 2026.10
        title: Magic Tower Revival (魔法の塔 復刻版) — iOS app, available on the App Store
        lines: ["Personal Project | C#, Unity, iOS | <a href=\"https://apps.apple.com/jp/app/%E9%AD%94%E6%B3%95%E3%81%AE%E5%A1%94-%E5%BE%A9%E5%88%BB%E7%89%88/id6815624226\">App Store</a>"]
        bullets:
          - Remade “Magic Tower,” a 1995 roguelike dungeon RPG released by N.W for the PC-9800 series, for iPhone with permission from the original author.
          - Faithfully reproduced the original 50-floor layouts, enemy stats, and event sequences, with a UI redesigned for modern smartphones. Built with C# and Unity.
          - Solely responsible for every stage, from planning, UI design, and development to App Store release and operation (free to play with one-time in-app purchases).
      - period: 2025.3 – present
        title: LLM-based Mobile Game App (in development)
        lines: ["Personal Project | Swift, Python, OpenAI API"]
        bullets:
          - Designing and developing an iOS game app where users ask questions to guess an answer the AI has thought of.
          - Integrated OpenAI GPT API and AWS Lambda for real-time inference and data handling.
          - Applied prompt engineering techniques to constrain and guide model responses across different genres (e.g., animals, brands, countries).
          - Leveraged Retrieval-Augmented Generation (RAG) to reduce API call cost while maintaining consistency and relevance.
          - Built entirely using Swift and Xcode as a native iOS app. Demo available upon request.

